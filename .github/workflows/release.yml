name: Release

# Keep releases private until Windows and macOS artifacts have passed validation.
# macOS uses ad-hoc signing; users approve its first launch in Privacy & Security.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  release:
    runs-on: windows-latest
    outputs:
      release_id: ${{ steps.build.outputs.releaseId }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install frontend dependencies
        run: npm ci

      - name: Sync app version from tag
        run: node -e "const fs=require('fs'); const version=process.env.RELEASE_TAG.replace(/^v/,''); for (const file of ['package.json','src-tauri/tauri.conf.json']) { const json=JSON.parse(fs.readFileSync(file,'utf8')); json.version=version; fs.writeFileSync(file, JSON.stringify(json,null,2)+'\n'); }"

      # Separate steps (not one multi-line block): on the windows-latest pwsh
      # shell a multi-line run wouldn't abort on the first failure, so a failed
      # check could be masked by a later passing command. One command per step
      # makes GitHub gate on each exit code independently.
      - name: Type-check (svelte-check)
        run: npm run check

      - name: Unit tests (Vitest)
        run: npm test

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build Windows updater artifacts in a draft release
        id: build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Key was generated with no password — keep this empty.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          projectPath: .
          tagName: ${{ github.ref_name }}
          releaseName: 'Invoice Maker ${{ github.ref_name }}'
          releaseBody: |
            Windows and universal macOS builds, with signed automatic updates.

            macOS: Open the DMG and drag Invoice Maker to Applications. The app is ad-hoc signed, but is not Apple-notarized. On first launch, macOS may block it: open System Settings > Privacy & Security, choose Open Anyway for Invoice Maker, and confirm Open. This is a one-time approval for this installation.
          releaseDraft: true
          prerelease: false

  macos:
    # tauri-action updates latest.json by reading and replacing it. Serialize
    # uploads so macOS retains the Windows updater entries.
    needs: release
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Sync app version from tag
        run: node -e "const fs=require('fs'); const version=process.env.RELEASE_TAG.replace(/^v/,''); for (const file of ['package.json','src-tauri/tauri.conf.json']) { const json=JSON.parse(fs.readFileSync(file,'utf8')); json.version=version; fs.writeFileSync(file, JSON.stringify(json,null,2)+'\n'); }"

      - name: Rust tests on macOS
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build universal macOS updater artifacts in the draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          # Seal the entire app bundle, including Info.plist and resources.
          # Developer ID signing and notarization require an Apple Developer account.
          APPLE_SIGNING_IDENTITY: '-'
        with:
          projectPath: .
          releaseId: ${{ needs.release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          args: --target universal-apple-darwin

      - name: Verify the app, updater archive, and DMG
        shell: bash
        run: |
          set -euo pipefail
          bundle_root='src-tauri/target/universal-apple-darwin/release/bundle'
          version="${RELEASE_TAG#v}"
          bash scripts/verify-macos-bundle.sh "$bundle_root/macos/Invoice Maker.app" "$version"

          mkdir "$RUNNER_TEMP/invoice-updater"
          tar -xzf "$bundle_root/macos/Invoice Maker.app.tar.gz" -C "$RUNNER_TEMP/invoice-updater"
          bash scripts/verify-macos-bundle.sh "$RUNNER_TEMP/invoice-updater/Invoice Maker.app" "$version"

          images=("$bundle_root"/dmg/*.dmg)
          test "${#images[@]}" -eq 1
          test -f "${images[0]}"
          mountpoint="$RUNNER_TEMP/invoice-release-dmg"
          mkdir "$mountpoint"
          hdiutil attach "${images[0]}" -readonly -nobrowse -mountpoint "$mountpoint"
          trap 'hdiutil detach "$mountpoint"' EXIT
          bash scripts/verify-macos-bundle.sh "$mountpoint/Invoice Maker.app" "$version"

  publish:
    needs: [release, macos]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install updater signature verifier
        run: sudo apt-get update && sudo apt-get install -y minisign

      - name: Download draft release artifacts
        run: gh release download "$RELEASE_TAG" --dir release-artifacts

      - name: Validate complete updater manifest and signatures
        run: python3 scripts/verify-release.py "$RELEASE_TAG" release-artifacts

      - name: Publish the verified release
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
